<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PR Wall</title>
  <meta name="description" content="Pull requests to open-source projects, newest first.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 0v16' stroke='%23737373' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%236e56cf'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="me" id="me" href="#">
        <img id="me-avatar" alt="" width="40" height="40">
        <span>
          <strong id="me-name">PR Wall</strong>
          <small id="me-login"></small>
        </span>
      </a>

      <nav class="status" id="status" aria-label="Status"></nav>

      <details class="repos" id="repos-box" open>
        <summary>Repositories <span class="n" id="repo-count"></span></summary>
        <ul id="repos"></ul>
        <button type="button" class="more" id="repos-more" hidden></button>
      </details>

      <p class="updated" id="updated"></p>
    </aside>

    <main class="main">
      <header class="top">
        <div class="title">
          <h1>Pull requests <span class="n" id="total"></span></h1>
          <p id="tagline"></p>
        </div>
        <label class="search">
          <span class="sr-only">Search</span>
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
          <input id="q" type="search" placeholder="Search" autocomplete="off">
        </label>
      </header>

      <dl class="stats" id="stats"></dl>

      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-head">
          <h2 id="chart-title">Pull requests per month</h2>
          <ul class="legend">
            <li><i class="key merged"></i>Merged</li>
            <li><i class="key other"></i>Open or closed</li>
          </ul>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <div class="filter" id="filter" hidden></div>
      <section class="log" id="log" aria-live="polite"></section>
    </main>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
